# GitHub Actions CI/CD (.github/workflows/deploy.yml)
name: Deploy FollowTrain

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Install backend dependencies  
      working-directory: ./backend
      run: npm ci
    
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false
    
    - name: Run backend tests
      working-directory: ./backend
      run: npm test
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

  # Note: Zeabur deployment is handled automatically through GitHub integration
  # No explicit deployment steps needed as Zeabur connects directly to the repository
  # Just ensure the zeabur.json files are properly configured in each service directory
